name: GHCR diagnostic RunPod worker (NO MODELS)
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnostics CPU tests
        run: |
          python -m unittest tests/test_ghcr_smoke.py -v || python -m unittest discover -s tests -p 'test_ghcr_smoke.py' -v
          python runtime/ghcr_smoke.py --self-test
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push diagnostic RunPod worker
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr-smoke
          platforms: linux/amd64
          push: true
          tags: ghcr.io/open-video-recovery/ltx23-runpod-recovery:diagnostics
          provenance: false
          sbom: false
      - name: Pull and run same published image offline
        run: |
          docker pull ghcr.io/open-video-recovery/ltx23-runpod-recovery:diagnostics
          docker run --rm --network none ghcr.io/open-video-recovery/ltx23-runpod-recovery:diagnostics python /app/ghcr_smoke.py --self-test
          echo "GHCR_RUNPOD_DIAGNOSTICS_IMAGE_PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable published digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "diagnostics digest = $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: no models, no video generation, no GPU test" >> "$GITHUB_STEP_SUMMARY"
