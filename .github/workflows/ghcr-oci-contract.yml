name: GHCR OCI embedded-model contract (fake test weights)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghcr-oci-contract.yml"
      - "Dockerfile.oci-contract"
      - ".dockerignore"
      - "scripts/model_chunks.py"
      - "scripts/oci_contract_fixture.py"
      - "tests/test_model_chunks.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-oci-contract
  cancel-in-progress: false

jobs:
  model-bundled-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU contract tests, no model downloads
        run: |
          python -m unittest discover -s tests -v
          python scripts/oci_contract_fixture.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fake-model OCI contract image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile.oci-contract
          push: true
          tags: ghcr.io/open-video-recovery/ltx23-runpod-recovery:oci-contract
          platforms: linux/amd64
          provenance: false
          sbom: false
      - name: Pull and test the PUBLISHED image (no network inside)
        run: |
          set -euo pipefail
          docker pull ghcr.io/open-video-recovery/ltx23-runpod-recovery:oci-contract
          docker run --rm --network none ghcr.io/open-video-recovery/ltx23-runpod-recovery:oci-contract
          echo "GHCR_PUBLISHED_EMBEDDED_CHUNK_CONTRACT_PASS"
      - name: Record immutable image manifest digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "GHCR_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "WARNING: fake model fixture; no real I2V generation" >> "$GITHUB_STEP_SUMMARY"
