name: GHCR build and push engine base (no model weights; no tests)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghcr-engine-build.yml"
      - "Dockerfile.ghcr-engine"
      - ".dockerignore"
      - "runtime/worker.py"
      - "runtime/start.sh"
      - "runtime/restore_model_bundle.py"
      - "models.lock.json"
      - "workflows/**"
      - "third_party_licenses/**"
      - "NOTICE-THIRD-PARTY.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-engine-base
  cancel-in-progress: false

jobs:
  push-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push engine base (NO workflow tests)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr-engine
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/open-video-recovery/ltx23-runpod-recovery:engine-base
            ghcr.io/open-video-recovery/ltx23-runpod-recovery:engine-base-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record published digest (no pull test)
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'GHCR engine base (no model weights): %s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'NOTE: NOT a video generation endpoint\n' >> "$GITHUB_STEP_SUMMARY"
