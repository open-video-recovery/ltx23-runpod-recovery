name: Refresh LTX 2.3 / 10Eros model release notice

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: 5ch-final-ghcr-release
  cancel-in-progress: false

jobs:
  refresh-notice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update only license and OCI metadata; preserve model layers
        run: python3 scripts/oci/refresh_release_notice.py
