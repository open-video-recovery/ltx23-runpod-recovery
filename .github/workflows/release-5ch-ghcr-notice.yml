name: Final 5ch model license + metadata release (reuses 22 layers)

on:
  push:
    branches: [release/5ch-public-cleanup-20261106]
    paths:
      - ".github/workflows/release-5ch-ghcr-notice.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: 5ch-final-ghcr-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh upstream NOTICE using existing immutable image layers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/oci/refresh_release_notice.py
