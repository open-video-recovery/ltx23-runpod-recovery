name: GHCR publish existing OCI with license layer (automatic, no tests)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ghcr-legacy-license-overlay.yml"
      - "scripts/oci/repack_public_oci.py"
      - "third_party_licenses/**"
      - "NOTICE-THIRD-PARTY.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-ltx23-licensed-oci
  cancel-in-progress: false

jobs:
  publish-to-ghcr:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OCI_SOURCE_IMAGE: ${{ secrets.OCI_SOURCE_IMAGE }}
      GHCR_DEST_IMAGE: ghcr.io/open-video-recovery/ltx23-10eros-licensed:ltx23-v14
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish existing public OCI to GHCR with one license layer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_SOURCE_IMAGE" || { echo 'OCI_SOURCE_IMAGE_NOT_CONFIGURED'; exit 2; }
          test -n "$GITHUB_TOKEN" || { echo 'GHCR_PUSH_TOKEN_UNAVAILABLE'; exit 2; }
          # Original Docker Hub layers smaller than 9 GB are copied byte-for-byte.
          # One oversize layer is split into compressed OCI chunks; original
          # model/Worker/Workflow bytes are preserved, restored on startup.
          # No Docker daemon, GPU tests or Hugging Face model downloads.
          python3 scripts/oci/repack_public_oci.py
