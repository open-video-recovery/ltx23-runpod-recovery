name: Stop in-flight model GHCR publication during release audit

on:
  push:
    branches: [main]
    paths: [".github/workflows/stop-inflight-model-publish.yml"]

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel pre-audit public model republish (not an image deletion)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --output "$RUNNER_TEMP/cancel-response.json" \
            --write-out 'HTTP %{http_code}\n' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/open-video-recovery/ltx23-runpod-recovery/actions/runs/41989261449/cancel"
          echo "Cancelled or already finished: model publication workflow 41989261449"
