name: Collect official model license policies (no model weights)

on:
  push:
    branches: [main, feat/public-ghcr-license-gates-20261105]
    paths:
      - ".github/workflows/legal-policy-snapshot.yml"
      - "scripts/collect_official_policies.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-official-legal-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official Lightricks and Google policies
        run: |
          python scripts/collect_official_policies.py --out legal-snapshot
      - name: Print provenance digest manifest
        run: cat legal-snapshot/policy-snapshot.json
      - name: Upload only official legal texts and audit provenance
        uses: actions/upload-artifact@v4
        with:
          name: public-model-legal-snapshot
          path: legal-snapshot/
          retention-days: 14
