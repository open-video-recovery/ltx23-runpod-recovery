name: Netlify metrics checks
on:
  push:
    branches: [feat/netlify-privacy-metrics-20261106]
  pull_request:
    paths:
      - 'lib/metrics.mjs'
      - 'netlify/functions/**'
      - 'telemetry.js'
      - 'index.html'
      - 'admin-stats.html'
      - 'scripts/**'
      - 'netlify.toml'
      - 'package.json'
      - 'test/**'
      - '.github/workflows/netlify-metrics-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and analytics tests
        run: |
          node --check telemetry.js
          node --check netlify/functions/track.mjs
          node --check netlify/functions/stats.mjs
          node --check netlify/functions/prune-metrics.mjs
          node --test
      - name: Build publish artifacts
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/telemetry.js
          test -f dist/admin-stats.html
          test ! -e dist/netlify/functions/track.mjs
